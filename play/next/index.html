    <script>
      (function () {
        "use strict";

        // ---- iOS audio unlock: remember every AudioContext the engine creates, resume them inside a tap. The title
        // screen's PLAY is the first tap a player makes, so PLAY unlocks web audio (the document listeners below).
        var NativeAudioContext = window.AudioContext || window.webkitAudioContext;
        var audioContexts = [];
        if (NativeAudioContext) {
          var TrackedAudioContext = function (options) {
            var context = options !== undefined ? new NativeAudioContext(options) : new NativeAudioContext();
            audioContexts.push(context);
            return context;
          };
          TrackedAudioContext.prototype = NativeAudioContext.prototype;
          window.AudioContext = TrackedAudioContext;
          if (window.webkitAudioContext) window.webkitAudioContext = TrackedAudioContext;
        }
        function unlockAudio() {
          audioContexts.forEach(function (context) {
            try {
              if (context.state !== "running" && context.resume) context.resume();
              var buffer = context.createBuffer(1, 1, 22050);
              var source = context.createBufferSource();
              source.buffer = buffer;
              source.connect(context.destination);
              source.start(0);
            } catch (e) { /* a closed context: nothing to unlock */ }
          });
        }

        // ---- no page scroll, bounce, pinch or double-tap zoom: every touch belongs to the game.
        var blockDefault = function (e) { if (e.cancelable) e.preventDefault(); };
        document.addEventListener("touchmove", blockDefault, { passive: false });
        document.addEventListener("gesturestart", blockDefault, { passive: false });
        document.addEventListener("gesturechange", blockDefault, { passive: false });
        document.addEventListener("dblclick", blockDefault, { passive: false });
        document.addEventListener("contextmenu", blockDefault);

        var canvas = document.getElementById("unity-canvas");

        var fill = document.getElementById("progress-fill");
        var percent = document.getElementById("progress-text");
        var toast = document.getElementById("toast");

        function showBanner(message, type) {
          if (type === "error") { showError(message); return; }
          toast.textContent = String(message).replace(/<[^>]*>/g, "");
          toast.style.display = "block";
          clearTimeout(toastTimer);
          toastTimer = setTimeout(function () { toast.style.display = "none"; }, 5000);
        }

        function showError(message) {
          document.getElementById("error-text").textContent = String(message).replace(/<[^>]*>/g, "");
          document.getElementById("error").style.display = "flex";
          loader.classList.add("done");
        }

        function setProgress(p) {
          var value = Math.max(0, Math.min(1, p));
          fill.style.width = (value * 100).toFixed(1) + "%";
          percent.textContent = value >= 1 ? "STARTING" : "LOADING " + Math.round(value * 100) + "%";
        }

        // Every tap resumes the engine's audio inside the user gesture iOS requires: the title's PLAY tap is the first one,
        // and any later tap also resumes a context created afterwards (or one Safari suspended in the background).
        document.addEventListener("touchend", unlockAudio, { passive: true });
        document.addEventListener("click", unlockAudio);
        window.skyShotUnlockAudio = unlockAudio;

          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),

            setProgress(1);
            loader.classList.add("done");   // a loading screen only: the game opens on its title screen
            try { canvas.focus({ preventScroll: true }); } catch (err) { canvas.focus(); }
          }).catch(function (message) {
            showError(message);
          });
        };
        script.onerror = function () {
          showError("The game files could not be downloaded. Check the connection and reload.");
        };
        document.body.appendChild(script);
      })();
